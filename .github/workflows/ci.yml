name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Vulnerable packages gate
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -qE "High|Critical" vuln.txt; then echo "High/Critical vulnerability found"; exit 1; fi
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Unit, architecture and API tests (SQLite)
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"
      - name: Migrations apply cleanly
        run: dotnet tool install -g dotnet-ef && dotnet ef migrations has-pending-model-changes -p src/Licensing.Infrastructure -s src/Licensing.Api

  # The SQL Server-only tests (migration backfills) skip under SQLite; this job runs the whole suite on SQL Server.
  backend-sqlserver:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throw-away password of the CI-only SQL Server service container.
          MSSQL_SA_PASSWORD: CI-ONLY-Sql-Pa55word!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      LICENSING_TEST_SQLSERVER: "1"
      LICENSING_TEST_SQLSERVER_SERVER: Server=localhost,1433;User Id=sa;Password=CI-ONLY-Sql-Pa55word!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - name: All tests on SQL Server
        run: dotnet test --no-build -c Release

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Dependency audit (shipped code high+, build tooling critical)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - run: npx ng test --watch=false
      - run: npx ng build
